<!DOCTYPE html>
<html lang="en">
<head>
<!--
  you found a page that doesn't exist.
  but you found this comment, so that's something.
-->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark light">
<meta name="theme-color" content="#111" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#fafaf8" media="(prefers-color-scheme: light)">
<meta name="robots" content="noindex">
<title>404 - vnykmshr.com</title>
<link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="assets/css/style.css">
<style>
body { align-items: center; justify-content: center; text-align: center; }
main { display: block; padding: 24px; }
h1 { font-family: var(--mono); font-size: 3rem; font-weight: 600; margin-bottom: 12px; }
p { color: var(--fg-dim); margin-bottom: 24px; }
p.moved { color: var(--fg); }
</style>
</head>
<body>
<main class="container">
  <img src="assets/img/favicon.svg" alt="" width="48" height="48" style="margin-bottom:24px;opacity:0.6">
  <h1>404</h1>
  <p>nothing here. probably never was.</p>
  <a href="/">back to something</a>
</main>
<script>
(function () {
  var path = window.location.pathname;
  if (path.indexOf('/article/') !== 0) return;

  var h1 = document.querySelector('h1');
  var p = document.querySelector('main p');
  var a = document.querySelector('main a');

  h1.textContent = 'moved';
  p.textContent = "the writing moved - old links didn't.";
  p.className = 'moved';
  a.textContent = 'margin.1mb.dev';
  a.href = 'https://margin.1mb.dev';

  var sep = document.createTextNode(' · ');
  var home = document.createElement('a');
  home.href = '/';
  home.textContent = 'home';
  a.parentNode.insertBefore(sep, a.nextSibling);
  a.parentNode.insertBefore(home, sep.nextSibling);
})();
</script>
</body>
</html>
